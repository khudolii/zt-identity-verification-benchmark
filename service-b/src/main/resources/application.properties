server.port=8081

# Keycloak - running on Oracle VM 1
keycloak.url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:zt-benchmark}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:service-b}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:service-b-secret}

# JWKS endpoint for JWT local verification (loaded once at startup)
jwks.uri=${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/certs

# Trusted issuer public key for VC verification (Base64, set via env var)
# Generated by scripts/generate_vp.py
vc.trusted-public-key=${TRUSTED_ISSUER_PUBLIC_KEY:}

logging.level.com.zt=INFO
