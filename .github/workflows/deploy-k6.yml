name: Deploy k6 scripts

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'k6/**'
      - 'scripts/**'
      - '.github/workflows/deploy-k6.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/service-b

jobs:
  deploy:
    name: Deploy to Hetzner VM 2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Generate VP keypair in the runner ──────────────────────────────────
      # Runs generate_vp.py here so both outputs (vp.json + public key)
      # can be distributed to k6 server and Service B in the same workflow.
      - name: Generate VP keypair
        run: |
          pip3 install cryptography -q
          python3 scripts/generate_vp.py
          echo "TRUSTED_KEY=$(cat public_key.txt)" >> $GITHUB_ENV

      # ── Copy scripts and fresh vp.json to k6 server ───────────────────────
      - name: Copy k6 scripts and vp.json to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_VM2_HOST }}
          username: ${{ secrets.HETZNER_VM2_USER }}
          key: ${{ secrets.HETZNER_VM2_SSH_KEY }}
          source: "k6/,scripts/,vp.json"
          target: "~/zt-benchmark/"
          strip_components: 0

      # ── Write .env and install k6 ─────────────────────────────────────────
      - name: Write .env and install k6
        uses: appleboy/ssh-action@v1
        env:
          KEYCLOAK_IP: ${{ secrets.HETZNER_HOST }}
          SERVICE_B_IP: ${{ secrets.GCP_HOST }}
          KC_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KC_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KC_REALM: ${{ secrets.KEYCLOAK_REALM }}
        with:
          host: ${{ secrets.HETZNER_VM2_HOST }}
          username: ${{ secrets.HETZNER_VM2_USER }}
          key: ${{ secrets.HETZNER_VM2_SSH_KEY }}
          envs: KEYCLOAK_IP,SERVICE_B_IP,KC_CLIENT_ID,KC_CLIENT_SECRET,KC_REALM
          script: |
            mkdir -p ~/zt-benchmark

            # Write .env with all connection details
            cat > ~/zt-benchmark/.env << EOF
            KEYCLOAK_IP=${KEYCLOAK_IP}
            SERVICE_B_IP=${SERVICE_B_IP}
            KC_CLIENT_ID=${KC_CLIENT_ID}
            KC_CLIENT_SECRET=${KC_CLIENT_SECRET}
            KC_REALM=${KC_REALM}
            EOF
            chmod 600 ~/zt-benchmark/.env
            echo ".env written."

            # Install k6 if not present
            if ! command -v k6 &> /dev/null; then
              echo "Installing k6..."
              gpg --no-default-keyring \
                --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
                --keyserver hkp://keyserver.ubuntu.com:80 \
                --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
              echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
                | tee /etc/apt/sources.list.d/k6.list
              apt-get update && apt-get install -y k6
              echo "k6 installed: $(k6 version)"
            else
              echo "k6 already installed: $(k6 version)"
            fi

      # ── Restart Service B on GCP with the new public key ──────────────────
      # Every deploy-k6 run generates a fresh keypair, so Service B must be
      # restarted with the matching TRUSTED_ISSUER_PUBLIC_KEY.
      - name: Update Service B public key
        uses: appleboy/ssh-action@v1
        env:
          TRUSTED_KEY: ${{ env.TRUSTED_KEY }}
          KEYCLOAK_URL: http://${{ secrets.HETZNER_HOST }}
          KC_REALM: ${{ secrets.KEYCLOAK_REALM }}
          KC_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KC_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          IMAGE: ${{ env.IMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: TRUSTED_KEY,KEYCLOAK_URL,KC_REALM,KC_CLIENT_ID,KC_CLIENT_SECRET,IMAGE,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker stop service-b || true
            docker rm   service-b || true
            docker run -d \
              --name service-b \
              --restart unless-stopped \
              -p 8081:8081 \
              -e KEYCLOAK_URL="${KEYCLOAK_URL}" \
              -e KEYCLOAK_REALM="${KC_REALM}" \
              -e KEYCLOAK_CLIENT_ID="${KC_CLIENT_ID}" \
              -e KEYCLOAK_CLIENT_SECRET="${KC_CLIENT_SECRET}" \
              -e TRUSTED_ISSUER_PUBLIC_KEY="${TRUSTED_KEY}" \
              "${IMAGE}:latest"
            echo "Service B restarted with updated public key."
